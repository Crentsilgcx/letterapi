<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delivery Register</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="/reception">
      <span class="brand-mark">LR</span>
      <span th:text="${organizationName}">Office</span>
    </a>
    <nav class="nav">
      <a href="/reception">Reception</a>
      <a href="/reception/deliveries">Register</a>
      <a sec:authorize="hasRole('ADMIN')" href="/admin">Administration</a>
      <form method="post" action="/logout">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button>Sign out</button>
      </form>
    </nav>
  </div>
</header>
<main class="shell">
  <div class="eyebrow">Audit register</div>
  <h1>All letter deliveries</h1>
  <form method="get" class="card form-inline">
    <div class="field">
      <label>Search</label>
      <input name="q" th:value="${q}" placeholder="Tracking, person, organization, recipient, subject...">
    </div>
    <div class="field" style="max-width:220px">
      <label>Status</label>
      <select name="status">
        <option value="" th:selected="${status == null || status == ''}">All</option>
        <option value="DELIVERED" th:selected="${status == 'DELIVERED'}">Delivered</option>
        <option value="RECEIVED" th:selected="${status == 'RECEIVED'}">Received</option>
      </select>
    </div>
    <button class="btn primary">Filter</button>
  </form>
  <section class="card section">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tracking</th>
            <th>Status</th>
            <th>Delivery person</th>
            <th>Organization</th>
            <th>Recipient</th>
            <th>Subject / Reference</th>
            <th>Delivered</th>
            <th>Received</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="d:${deliveries.content}">
            <td><a th:href="@{/reception/deliveries/{id}(id=${d.id})}" th:text="${d.trackingNumber}"></a></td>
            <td>
              <span class="status" th:classappend="${d.status.name() == 'RECEIVED'} ? ' received' : ' delivered'" th:text="${d.status}"></span>
            </td>
            <td th:text="${d.deliveryPersonName}"></td>
            <td th:text="${d.organizationName}"></td>
            <td th:text="${d.recipientName}"></td>
            <td>
              <strong th:text="${d.subject}"></strong><br>
              <span class="muted" th:text="${d.referenceNumber}"></span>
            </td>
            <td class="nowrap" th:text="${#temporals.format(d.deliveredAt,'dd MMM yyyy HH:mm')}"></td>
            <td class="nowrap" th:text="${d.receivedAt != null ? #temporals.format(d.receivedAt,'dd MMM yyyy HH:mm') : '—'}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(deliveries.content)}">
            <td colspan="8" class="empty">No matching deliveries.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <a th:if="${deliveries.hasPrevious()}" th:href="@{/reception/deliveries(page=${deliveries.number-1},q=${q},status=${status})}">← Previous</a>
      <span class="muted" th:text="'Page '+${deliveries.number+1}+' of '+${deliveries.totalPages}"></span>
      <a th:if="${deliveries.hasNext()}" th:href="@{/reception/deliveries(page=${deliveries.number+1},q=${q},status=${status})}">Next →</a>
    </div>
  </section>
</main>
</body>
</html>

# Activate with SPRING_PROFILES_ACTIVE=prod behind HTTPS and a TLS-capable MySQL.
# Configure TLS via Spring Boot (or terminate TLS at reverse proxy and set server.forward-headers-strategy=framework).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC&connectionTimeZone=SERVER
server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: ${SERVER_SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
